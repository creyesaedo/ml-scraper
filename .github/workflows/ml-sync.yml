name: ML Sync

on:
  schedule:
    # Weekly: Monday 03:00 UTC. Matches the historical default of SYNC_DAY_OF_WEEK / SYNC_HOUR.
    # GitHub disables scheduled workflows after 60 days of repo inactivity — any commit reactivates them.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      app_mode:
        description: 'Override APP_MODE for this run (leave blank to use repo var)'
        required: false
        type: choice
        options:
          - ''
          - DEVELOPMENT
          - PRODUCTION
        default: ''
      site:
        description: 'Override siteId for this run (e.g. MLB). Blank = use APP_MODE sites.'
        required: false
        type: string
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    # ~100 min for PRODUCTION (Core 8). Leaves headroom below GitHub's 360-min job limit.
    timeout-minutes: 350
    env:
      # Precedence: workflow_dispatch input → repo variable.
      APP_MODE: ${{ inputs.app_mode || vars.APP_MODE }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DECODO_API_TOKEN: ${{ secrets.DECODO_API_TOKEN }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      # The plan's req/s cap is the ONLY concurrency knob you set. The scraper
      # auto-sizes its in-flight pool (SCRAPER_MAX_CONCURRENT, CATEGORY/PRODUCT_
      # CONCURRENCY) from this via Little's law to saturate the rate. Do NOT pin
      # SCRAPER_MAX_CONCURRENT here — a fixed value caps the pool below what's
      # needed to reach the rate (~375 in flight at 25 req/s).
      DECODO_RATE_LIMIT_PER_SEC: '20'
      SCRAPER_FAILURE_DUMP_DIR: 'tmp/scraper-failures'
      # Explicit: the in-process NestJS cron stays off — GitHub `schedule:` is the only trigger.
      ENABLE_INTERNAL_SCHEDULER: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to Neon
        # Idempotent. Uses DIRECT_URL (via prisma.config.ts) — pgBouncer would reject DDL.
        run: npx prisma db push --accept-data-loss=false

      - name: Build
        run: npm run build

      - name: Run sync
        # `inputs.site` only set on manual dispatch; blank → no arg → APP_MODE sites.
        run: npm run sync:run -- ${{ inputs.site }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-failures-${{ github.run_id }}
          path: tmp/scraper-failures/
          if-no-files-found: ignore
          retention-days: 14
